services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: playbook
      POSTGRES_USER: playbook
      POSTGRES_PASSWORD: playbook-local-demo-only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbook -d playbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.11.10
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-model:
    image: ollama/ollama:0.11.10
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: examples/hybrid_search_api/Dockerfile
    environment:
      DATABASE_URL: postgresql://playbook:playbook-local-demo-only@postgres:5432/playbook
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: playbook_pdf_chunks
      VECTOR_SIZE: "768"
      EMBEDDING_URL: http://ollama:11434/api/embed
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_TIMEOUT_SECONDS: "60"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: examples/hybrid_search_api/Dockerfile
    command: ["python", "-m", "examples.hybrid_search_api.worker"]
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://playbook:playbook-local-demo-only@postgres:5432/playbook
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: playbook_pdf_chunks
      VECTOR_SIZE: "768"
      EMBEDDING_URL: http://ollama:11434/api/embed
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_TIMEOUT_SECONDS: "60"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
