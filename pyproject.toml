[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-playbook"
version = "0.1.0"
description = "Hands-on AI and generative AI engineering study guide"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110,<1",
  "pypdf>=5.0,<7",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.1,<4",
  "qdrant-client>=1.10,<2",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
notebooks = [
  "faiss-cpu",
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.1,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "PyMuPDF",
  "python-docx",
  "scikit-learn>=1.4,<2",
  "sentence-transformers",
]
openai = ["openai>=1.30,<3"]
gemini = ["google-genai>=1,<2"]
anthropic = ["anthropic>=0.30,<1"]
aws = ["boto3>=1.34,<2"]
langchain = ["langchain>=0.2,<2", "langchain-openai>=0.1,<2"]
langgraph = ["langgraph>=0.2,<2"]
langsmith = ["langsmith>=0.1,<1"]
llamaindex = ["llama-index-core>=0.10,<1"]
dev = ["httpx>=0.27,<1", "nbformat>=5.9,<6", "pytest>=8,<9", "ruff>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
